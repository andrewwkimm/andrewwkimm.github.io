<!-- Stable blog-index content inside .wrapper.page. -->
<h1 class="sr-only">Blog</h1>
<div class="filter-bar">
  <details class="drop">
    <summary><span>Tags</span></summary>
    <div class="drop-menu">
      <label class="drop-option"><input type="checkbox"> sample</label>
      <button class="drop-clear" type="button">Clear tags</button>
    </div>
  </details>
  <div class="bar-right"><span class="bar-count">1 post</span></div>
</div>
<ul class="post-list">
  <li class="post">
    <h2><a href="/blog/sample-post/">Sample Post</a></h2>
    <p class="post-meta">August 16, 2026<span class="bar">|</span><a href="/blog/tags/sample/">sample</a></p>
    <p class="item-summary">Sample summary.</p>
  </li>
</ul>
